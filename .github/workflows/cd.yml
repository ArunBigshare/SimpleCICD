name: ASP.NET Core CD

on:
  workflow_run:
    workflows: ["ASP.NET Core CI"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build application
      run: dotnet build --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish --configuration Release --output ${{ github.workspace }}/publish --no-build

    - name: Verify publish output
      run: ls -la ${{ github.workspace }}/publish

    - name: Create deployment package
      run: |
        cd ${{ github.workspace }}/publish
        zip -r ${{ github.workspace }}/SimpleCICD.zip .

    - name: Verify zip was created
      run: ls -la ${{ github.workspace }}/SimpleCICD.zip

    - name: Upload deployment package
      uses: actions/upload-artifact@v4
      with:
        name: SimpleCICD
        path: ${{ github.workspace }}/SimpleCICD.zip