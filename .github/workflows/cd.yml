name: ASP.NET Core CD

on:
  workflow_run:
    workflows: ["ASP.NET Core CI"]
    types:
      - completed

jobs:
  publish:
    runs-on: self-hosted

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Check .NET
      run: dotnet --version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build application
      run: dotnet build --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish --configuration Release --output "${{ github.workspace }}/publish" --no-build

    - name: Verify publish output
      run: dir "${{ github.workspace }}\publish"

    - name: Create deployment package
      run: |
        Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath "${{ github.workspace }}\SimpleCICD.zip" -Force

    - name: Verify zip was created
      run: dir "${{ github.workspace }}\SimpleCICD.zip"

    - name: Upload deployment package
      uses: actions/upload-artifact@v4
      with:
        name: SimpleCICD
        path: ${{ github.workspace }}/SimpleCICD.zip

  deploy-to-iis:
    needs: publish
    runs-on: self-hosted

    steps:

    - name: Download deployment package
      uses: actions/download-artifact@v4
      with:
        name: SimpleCICD
        path: C:\deploy-temp

    - name: Stop IIS site and app pool
      shell: powershell
      run: |
        Import-Module WebAdministration
        Stop-WebSite -Name "YourSiteName" -ErrorAction SilentlyContinue
        Stop-WebAppPool -Name "YourAppPoolName" -ErrorAction SilentlyContinue

    - name: Clear old deployment files
      shell: powershell
      run: |
        Remove-Item -Path "C:\inetpub\wwwroot\TestCICD\*" -Recurse -Force -ErrorAction SilentlyContinue

    - name: Extract new deployment
      shell: powershell
      run: |
        Expand-Archive -Path "C:\deploy-temp\SimpleCICD.zip" -DestinationPath "C:\inetpub\wwwroot\TestCICD" -Force

    - name: Start IIS site and app pool
      shell: powershell
      run: |
        Import-Module WebAdministration
        Start-WebAppPool -Name "TestCICD"
        Start-WebSite -Name "TestCICD"

    - name: Verify site is running
      shell: powershell
      run: |
        Import-Module WebAdministration
        Get-WebAppPoolState -Name "TestCICD"
        Get-WebsiteState -Name "TestCICD"